  .rem input { width: 18px; height: 18px; accent-color: var(--teal); margin: 0; }
  button.go { width: 100%; background: var(--teal); color: var(--on-teal); border: 0; border-radius: 7px; padding: 13px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }

      return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    });
  }

  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(DATA.salt), iterations: DATA.iter }, k, 256);
    });
  }

  if (!window.crypto || !crypto.subtle || (DATA.gz && typeof DecompressionStream === 'undefined')) { fail('This browser is too old to open the page. Use a current Chrome, Edge, Safari or Firefox.'); return; }
  if (/[?&]lock\b/.test(location.search)) store.del();

  // signed in on this device before: open straight away
  var saved = store.get();
  if (saved) {
    $('f').style.visibility = 'hidden';
    open(b64(saved)).then(show, function () { store.del(); $('f').style.visibility = ''; });
  }

  $('eye').onclick = function () { var p = $('pw'); var t = p.type === 'password'; p.type = t ? 'text' : 'password'; this.textContent = t ? 'Hide' : 'Show'; };
  $('f').onsubmit = function (ev) {
    ev.preventDefault();
    $('err').style.display = 'none'; $('go').disabled = true; $('go').textContent = 'Opening...';
    var bits;
    derive($('pw').value).then(function (b) { bits = b; return open(b); }).then(function (html) {
      if ($('rem').checked) store.set(fromBuf(bits)); else store.del();
      show(html);
    }, function () { fail('That password is not right.'); $('pw').select(); });
  };
})();
</script>

<style>
  :root { --bg-a: #232930; --bg-b: #15181b; --card: #1d2125; --line: #343a40; --line2: #444c54; --text: #dde2e6; --muted: #8d979f; --faint: #616b74;
          --field: #262b30; --teal: #19aedb; --on-teal: #04212b; --err: #ffc9c5; --shadow: rgba(0,0,0,.45); color-scheme: dark; }
  :root[data-theme=light] { --bg-a: #ffffff; --bg-b: #dfe4e9; --card: #ffffff; --line: #dbe0e5; --line2: #c3cbd2; --text: #1b2025; --muted: #586470; --faint: #87919a;
          --field: #f2f4f6; --teal: #1199c4; --on-teal: #ffffff; --err: #8f231d; --shadow: rgba(30,40,50,.14); color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(ellipse at 50% 30%, var(--bg-a) 0%, var(--bg-b) 70%); color: var(--text);
         font: 16px/1.45 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; display: grid; place-items: center; padding: 20px; }
  form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px 22px; box-shadow: 0 20px 50px var(--shadow); }
  h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: .01em; font-weight: 700; }
  h1 i { font-style: normal; color: var(--teal); }
  p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .pw { display: flex; background: var(--field); border: 1px solid var(--line2); border-radius: 7px; }
  .pw:focus-within { border-color: var(--teal); }
  input[type=password], input[type=text] { flex: 1; min-width: 0; background: none; border: 0; color: inherit; font: inherit; font-size: 17px; padding: 12px; outline: none; }
  .eye { background: none; border: 0; color: var(--muted); padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .rem { display: flex; gap: 8px; align-items: center; margin: 14px 0 18px; color: var(--muted); font-size: 14px; font-weight: 400; cursor: pointer; }
  .rem input { width: 18px; height: 18px; accent-color: var(--teal); margin: 0; }
  button.go { width: 100%; background: var(--teal); color: var(--on-teal); border: 0; border-radius: 7px; padding: 13px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
  button.go:disabled { opacity: .6; cursor: progress; }
  .err { color: var(--err); background: rgba(229,83,75,.13); border-left: 3px solid #e5534b; border-radius: 6px; padding: 8px 10px; font-size: 14px; margin-top: 14px; display: none; }
  .foot { margin-top: 18px; color: var(--faint); font-size: 12px; text-align: center; }
</style>

  <div class="foot">fabricationtables.com</div>
</form>

    }, function () { fail('That password is not right.'); $('pw').select(); });
  };
})();
</script>

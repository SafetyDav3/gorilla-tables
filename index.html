  var fromBuf = function (buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var store = { get: function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
                set: function (v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
                del: function () { try { localStorage.removeItem(KEY); } catch (e) {} } };

  function fail(msg) { var e = $('err'); e.textContent = msg; e.style.display = 'block'; $('go').disabled = false; $('go').textContent = 'Open'; }
  // swap in the app only once this page has finished loading; swapping earlier (the saved
  // sign-in path) loses the app's styles and scripts in some browsers
  function show(html) {
    var go = function () { setTimeout(function () { document.open(); document.write(html); document.close(); }, 0); };
    if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
  }

  function open(raw) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['decrypt']).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(DATA.iv) }, key, b64(DATA.ct));
    }).then(function (plain) {
      if (!DATA.gz) return new TextDecoder().decode(plain);
      return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    });
  }

  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(DATA.salt), iterations: DATA.iter }, k, 256);
    });
  }

  if (!window.crypto || !crypto.subtle || (DATA.gz && typeof DecompressionStream === 'undefined')) { fail('This browser is too old to open the page. Use a current Chrome, Edge, Safari or Firefox.'); return; }
  if (/[?&]lock\b/.test(location.search)) store.del();

  // signed in on this device before: open straight away
  var saved = store.get();
  if (saved) {
    $('f').style.visibility = 'hidden';
    open(b64(saved)).then(show, function () { store.del(); $('f').style.visibility = ''; });
  }

  $('eye').onclick = function () { var p = $('pw'); var t = p.type === 'password'; p.type = t ? 'text' : 'password'; this.textContent = t ? 'Hide' : 'Show'; };
  $('f').onsubmit = function (ev) {
    ev.preventDefault();
    $('err').style.display = 'none'; $('go').disabled = true; $('go').textContent = 'Opening...';
    var bits;
    derive($('pw').value).then(function (b) { bits = b; return open(b); }).then(function (html) {
      if ($('rem').checked) store.set(fromBuf(bits)); else store.del();
      show(html);
    }, function () { fail('That password is not right.'); $('pw').select(); });
  };
})();
</script>
